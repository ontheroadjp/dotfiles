# -------------------------------------------
# Key bindings reset
# -------------------------------------------
# unbind *all* keybindings
unbind-key -a
#unbind-key -n [char]

# all the regular tmux keys

bind-key C-b send-prefix
bind-key C-o rotate-window
bind-key C-z suspend-client
bind-key Space next-layout
bind-key ! break-pane
bind-key '"' split-window
bind-key '#' list-buffers
bind-key '$' command-prompt -I "#S" "rename-session '%%'"
bind-key % split-window -h
bind-key & confirm-before -p "kill-window #W? (y/n)" kill-window
bind-key "'" command-prompt -p index "select-window -t ':%%'"
bind-key ( switch-client -p
bind-key ) switch-client -n
bind-key , command-prompt -I "#W" "rename-window '%%'"
bind-key - delete-buffer
bind-key . command-prompt "move-window -t '%%'"
bind-key 0 select-window -t :0
bind-key 1 select-window -t :1
bind-key 2 select-window -t :2
bind-key 3 select-window -t :3
bind-key 4 select-window -t :4
bind-key 5 select-window -t :5
bind-key 6 select-window -t :6
bind-key 7 select-window -t :7
bind-key 8 select-window -t :8
bind-key 9 select-window -t :9
bind-key : command-prompt
bind-key \; last-pane
bind-key = choose-buffer
bind-key ? list-keys
bind-key D choose-client
bind-key L switch-client -l
bind-key [ copy-mode
bind-key ] paste-buffer
bind-key c new-window
bind-key d detach-client
bind-key f command-prompt "find-window '%%'"
bind-key i display-message
bind-key l last-window
bind-key n next-window
bind-key o select-pane -t :.+
bind-key p previous-window
bind-key q display-panes
bind-key r refresh-client
bind-key s choose-session
bind-key t clock-mode
bind-key w choose-window
bind-key x confirm-before -p "kill-pane #P? (y/n)" kill-pane
# bind-key { swap-pane -U
# bind-key } swap-pane -D
bind-key '~' show-messages
bind-key PPage copy-mode -u
bind-key -r Up select-pane -U
bind-key -r Down select-pane -D
bind-key -r Left select-pane -L
bind-key -r Right select-pane -R
bind-key -r M-1 select-layout even-horizontal
bind-key -r M-2 select-layout even-vertical
bind-key -r M-3 select-layout main-horizontal
bind-key -r M-4 select-layout main-vertical
bind-key -r M-5 select-layout tiled
bind-key -r M-n next-window -a
bind-key -r M-o rotate-window -D
bind-key -r M-p previous-window -a
# bind-key -r M-Up resize-pane -U 5
# bind-key -r M-Down resize-pane -D 5
# bind-key -r M-Left resize-pane -L 5
# bind-key -r M-Right resize-pane -R 5
# bind-key -r C-Up resize-pane -U
# bind-key -r C-Down resize-pane -D
# bind-key -r C-Left resize-pane -L
# bind-key -r C-Right resize-pane -R

# -------------------------------------------
# Terminal / Color
# -------------------------------------------

# use tmux-256color
set -g default-terminal "tmux-256color"
# set -g default-terminal "xterm-256color"
set -g allow-passthrough on
set -g xterm-keys on

# Enabel TrueColor (24bit)
set -ag terminal-overrides ",xterm-256color:Tc"
set -ag terminal-overrides ",screen-256color:Tc"
set -ag terminal-overrides ",tmux-256color:Tc"
set -ag terminal-overrides ",alacritty:Tc"

# support Alt/Meta key
set-option -g xterm-keys on

# -------------------------------------------
# ~/tmux.conf
# -------------------------------------------
set-environment -g LANG en_US.UTF-8
set-environment -g LC_TIME en_US.UTF-8
set-option -ag update-environment SESSION_MANAGER

# decrease key stroke delay
set -sg escape-time 0

# -------------------------------------------
# Popup window
# -------------------------------------------
bind g run-shell ' \
  current=$(tmux display-message -p "#{session_name}"); \
  if [ "$current" = "popup" ]; then \
    tmux detach-client; \
  else \
    tmux display-popup \
        -d "#{pane_current_path}" \
        -w 80% \
        -h 80% \
        -E "tmux new-session \
        -A \
        -s popup"; \
  fi'

bind-key -n C-w run-shell ' \
  current=$(tmux display-message -p "#{session_name}"); \
  if [ "$current" = "popup" ]; then \
    tmux detach-client; \
  else \
    tmux display-popup \
        -d "#{pane_current_path}" \
        -w 80% \
        -h 80% \
        -E "tmux new-session \
        -A \
        -s popup"; \
  fi'

bind-key -n C-e run-shell ' \
  current=$(tmux display-message -p "#{session_name}"); \
  if [ "$current" = "popup-server" ]; then \
    tmux detach-client; \
  else \
    tmux display-popup \
        -d "#{pane_current_path}" \
        -w 80% \
        -h 80% \
        -E "tmux new-session \
        -A \
        -s popup-server"; \
  fi'

# -------------------------------------------
# Key bindings
# -------------------------------------------
# reload ~/.tmux.conf
bind r source-file ~/.tmux.conf \; display "~/.tmux.conf - Reloaded!"

# -------------------------------------------
# Statusbar
# -------------------------------------------
# show statusbar
set -g status on

# position (top / bottom)
set -g status-position top

## refresh interval (default: 15s)
set -g status-interval 15

# statusbar colors
set -g status-fg white
set -g status-bg black

# left-side
set-option -g status-left-length 100
set -g status-left " #[fg=cyan]tmux #[fg=green]s:#S #[fg=yellow]w:#I #[fg=cyan]p:#P"

# right-side
set-option -g status-right-length 100
set-option -g status-right '#(get-ssid) #(get-battery) #(get-load-average -c tmux) #(get-sound-volume) [#[fg=cyan]#(env LANG=en_US.UTF-8 LC_TIME=en_US.UTF-8 /bin/date "+%b%e,%Y(%a) %H:%M")#[fg=white]]'

# center
set-option -g status-justify centre

## current window
set -g window-status-current-style "bg=colour060,fg=colour153"
set -g window-status-current-format " #I:#W "

# other windows
set -g window-status-style "bg=black,fg=white"
set -g window-status-format " #I:#W "

# -------------------------------------------
# shell
# -------------------------------------------
# new window/pane with login shell
set -g default-shell /bin/zsh
set -g default-command ""

# -------------------------------------------
# window
# -------------------------------------------
# window index stats with 1
# set -g base-index 1

# [Default Key bindings]
# prefix + c # create new window
# prefix + & # close current window
# prefix + , # change current window name
# prefix + n # change next window
# prefix + p # change previous window
# prefix + l # change last window
# prefix + [0-9] # change window by windown number
# [end]

bind-key h select-window -t :0

# bind-key -n C-Right next-window
# bind-key -n C-Left previous-window

set -g automatic-rename off

# -------------------------------------------
# Panes
# -------------------------------------------
# 1. tmux自身によるプロセス名からの
# 自動リネームを無効化（ウィンドウ名）
set-option -g automatic-rename off

# 2. アプリケーション(Zsh, Vim, SSH等)からの
# エスケープシーケンスによるタイトル変更を
# 許可しない（ペインタイトル）
set-option -g allow-rename off

# pane  切り替えるたびに fep を us へ切り替える（for ubuntu）
# script 本体は ontheroadjp/core-toolkit-for-gnome
set-hook -g after-select-pane 'run-shell "switch-input-to-us"'

# pane index starts with 1
# setw -g pane-base-index 1

# [default key bindings]
# prefix + q: display the pain number
# [end]

# vertical split (keep current path)
bind '\' split-window -h -c '#{pane_current_path}' ${SHELL} -i \; select-pane -T "shell#{pane_index}"

# horizontal split (keep current path)
bind '-' split-window -c '#{pane_current_path}' ${SHELL} -i \; select-pane -T "shell:#{pane_index}"

# next pane (no prefix: Ctrl+o)
# bind-key -n C-o select-pane -t :.+
bind-key -n C-o run-shell "switch-input-to-us" \; select-pane -t :.+

# resize by vim like key-binds
bind -r h resize-pane -L 1
bind -r j resize-pane -D 1
bind -r k resize-pane -U 1
bind -r l resize-pane -R 1

# zoom active pain
bind -n C-g resize-pane -Z

# move to new window
bind-key Enter break-pane -d

# pane border
set -g pane-border-style "fg=colour245"
set -g pane-active-border-style "fg=colour245"

# pane name
set -g allow-rename off
set -g pane-border-status top
# set -g pane-border-format " \
#     #{?pane_active,\
#     🔹#{pane_index}:#{?#{==:#{pane_title},MBP2014.local}, NoName, #{pane_title}}🔹,\
#     #{pane_index}:#{?#{==:#{pane_title},MBP2014.local}, NoName, #{pane_title}} \
#     } #[default]"

set -g pane-border-format " \
#{?pane_active,\
🔸 #[fg=orange]#{session_name}#[default]:#[fg=orange]#{window_index}#[default]:#[fg=orange]#{pane_index}#[default] (#[fg=orange]#{pane_title}#[default]) 🔸,\
#{session_name}:#{window_index}:#{pane_index} (#{pane_title}) \
} #[default]"

# -------------------------------------------
# Copy Mode
# -------------------------------------------
# set -g history-limit 100000
# set -g alternate-screen off
# bind-key [ copy-mode -u
# bind-key PPage copy-mode -eu

set -ga terminal-overrides ',tmux-256color:smcup@:rmcup@'

# -------------------------------------------
# Clock
# -------------------------------------------
set -g clock-mode-style 24
set -g clock-mode-colour cyan

# -------------------------------------------
# Visual notifications
# -------------------------------------------
set -g window-status-activity-style "bold,fg=yellow"

# -------------------------------------------
# COPY MODE
# -------------------------------------------
# vi key binds
setw -g mode-keys vi

# start selection with 'v'
bind-key -T copy-mode-vi v send -X begin-selection

# 'y' to pbcopy
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# 'Enter' to pbcopy
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
