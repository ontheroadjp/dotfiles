# -------------------------------------------
# ~/tmux.conf
# -------------------------------------------
# decrease key stroke delay
set -sg escape-time 0

# --------------------------------
# set-hook -g after-new-session "source-file ~/dotfiles/.tmux/.tmux.base.conf"
# --------------------------------

# --------------------------------
# Key bindings
# --------------------------------
# display list of key-bindings
bind ? list-keys

# reload ~/.tmux.conf
bind r source-file ~/.tmux.conf \; display "~/.tmux.conf - Reloaded!"

# -------------------------------------------
# Display
# -------------------------------------------
# enable 256 color display

# set -g default-terminal "screen-256color"
# set -ag terminal-overrides ",alacritty:RGB"

# -------------------------------------------
# Terminal / Color
# -------------------------------------------

# tmux-256color を使用
set -g default-terminal "tmux-256color"

# TrueColor (24bit) を有効化
# iTerm2 / Terminal.app / Alacritty に対応
set -ag terminal-overrides ",xterm-256color:Tc"
set -ag terminal-overrides ",xterm:Tc"
set -ag terminal-overrides ",alacritty:Tc"

# -------------------------------------------
# Statusbar
# -------------------------------------------
# show statusbar
set -g status on

# set-option -g status off

# position (top / bottom)
set -g status-position top

## refresh interval (default: 15s)
set -g status-interval 15

# ja UTF-8 support
set -g status-utf8 on

# statusbar colors
set -g status-fg white
set -g status-bg black

# left-side
set-option -g status-left-length 90
set -g status-left " #[fg=cyan]tmux #[fg=green]Session: #S #[fg=yellow]Window: #I #[fg=cyan]Pain: #P"

# right-side
set-option -g status-right-length 90
set-option -g status-right '#(get_ssid) #(battery -c tmux) [#[fg=cyan]%Y-%m-%d(%a) %H:%M#[fg=white]]'

# center
set-option -g status-justify centre

## current window
set -g window-status-current-style "bg=blue,fg=white,bold"
set -g window-status-current-format " #I:#W "

# other windows
set -g window-status-style "bg=gray,fg=black"
set -g window-status-format " #I:#W "

# -------------------------------------------
# shell
# -------------------------------------------
# new window/pane with login shell
set -g default-shell /bin/zsh
set -g default-command ""

# -------------------------------------------
# window
# -------------------------------------------
# window index stats with 1
set -g base-index 1

# Default Key bindings
# prefix + c # create new window
# prefix + & # close current window
# prefix + , # change current window name
# prefix + n # change next window
# prefix + p # change previous window
# prefix + [num] # change window by windown number

bind-key -n C-Right next-window
bind-key -n C-Left previous-window

# -------------------------------------------
# Panes
# -------------------------------------------

# pane index starts with 1
setw -g pane-base-index 1

# vertical split (keep current path)
bind '\' split-window -h -c '#{pane_current_path}' ${SHELL} -l

# horizontal split (keep current path)
bind '-' split-window -c '#{pane_current_path}' ${SHELL} -l

# next pane (no prefix: Ctrl+o)
bind-key -n C-o select-pane -t :.+

# resize by vim like key-binds
bind -r h resize-pane -L 1
bind -r j resize-pane -D 1
bind -r k resize-pane -U 1
bind -r l resize-pane -R 1

# zoom active pain
bind -n C-z resize-pane -Z

# pane border
set -g pane-border-style fg=colour245
set -g pane-active-border-style "fg=colour245 bg=black"

# -------------------------------------------
# Clock
# -------------------------------------------
set-window-option -g clock-mode-style "fg=cyan,bg=default"

# -------------------------------------------
# Visual notifications
# -------------------------------------------
# Monitor by window
set-window-option -g monitor-activity on

# Visual notification in status bar
set -g visual-activity on

# -------------------------------------------
# COPY MODE
# -------------------------------------------
# vi key binds
setw -g mode-keys vi

# start selection with 'v'
bind-key -T copy-mode-vi v send -X begin-selection

# 'y' to pbcopy
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# 'Enter' to pbcopy
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

