# -------------------------------------------
# ~/tmux.conf
# -------------------------------------------
set-environment -g LANG en_US.UTF-8
set-environment -g LC_TIME en_US.UTF-8

# decrease key stroke delay
set -sg escape-time 0

# -------------------------------------------
# Popup window
# -------------------------------------------
bind g run-shell ' \
  current=$(tmux display-message -p "#{session_name}"); \
  if [ "$current" = "popup" ]; then \
    tmux detach-client; \
  else \
    tmux display-popup \
        -d "#{pane_current_path}" \
        -w 80% \
        -h 80% \
        -E "tmux new-session \
        -A \
        -s popup"; \
  fi'

# -------------------------------------------
# Key bindings
# -------------------------------------------
# display list of key-bindings
bind ? list-keys

# reload ~/.tmux.conf
bind r source-file ~/.tmux.conf \; display "~/.tmux.conf - Reloaded!"

# zoom pain
bind b resize-pane -Z

# -------------------------------------------
# Terminal / Color
# -------------------------------------------

# use tmux-256color
set -g default-terminal "tmux-256color"
set -g allow-passthrough on
set -g xterm-keys on

# Enabel TrueColor (24bit)
set -ag terminal-overrides ",xterm-256color:Tc"
set -ag terminal-overrides ",screen-256color:Tc"
set -ag terminal-overrides ",tmux-256color:Tc"
set -ag terminal-overrides ",alacritty:Tc"


# support Alt/Meta key
set-option -g xterm-keys on

# -------------------------------------------
# Statusbar
# -------------------------------------------
# show statusbar
set -g status on

# position (top / bottom)
set -g status-position top

## refresh interval (default: 15s)
set -g status-interval 15

# statusbar colors
set -g status-fg white
set -g status-bg black

# left-side
set-option -g status-left-length 90
set -g status-left " #[fg=cyan]tmux #[fg=green]Session: #S #[fg=yellow]Window: #I #[fg=cyan]Pain: #P"

# right-side
set-option -g status-right-length 90
set-option -g status-right '󰖩 #(ssid) #(get-battery) #(get-load-average -c tmux) [#[fg=cyan]#(env LANG=en_US.UTF-8 LC_TIME=en_US.UTF-8 /bin/date "+%b %e, %Y (%a) %H:%M")#[fg=white]]'

# center
set-option -g status-justify centre

## current window
set -g window-status-current-style "bg=colour060,fg=colour153"
set -g window-status-current-format " #I:#W "

# other windows
set -g window-status-style "bg=black,fg=white"
set -g window-status-format " #I:#W "

# -------------------------------------------
# shell
# -------------------------------------------
# new window/pane with login shell
set -g default-shell /bin/zsh
set -g default-command ""

# -------------------------------------------
# window
# -------------------------------------------
# window index stats with 1
# set -g base-index 1

# [Default Key bindings]
# prefix + c # create new window
# prefix + & # close current window
# prefix + , # change current window name
# prefix + n # change next window
# prefix + p # change previous window
# prefix + [num] # change window by windown number
# [end]

bind-key -n C-Right next-window
bind-key -n C-Left previous-window

# -------------------------------------------
# Panes
#
# -------------------------------------------

# pane index starts with 1
# setw -g pane-base-index 1

# [default key bindings]
# prefix + q: display the pain number
# [end]

# vertical split (keep current path)
bind '\' split-window -h -c '#{pane_current_path}' ${SHELL} -l

# horizontal split (keep current path)
bind '-' split-window -c '#{pane_current_path}' ${SHELL} -l

# next pane (no prefix: Ctrl+o)
bind-key -n C-o select-pane -t :.+

# resize by vim like key-binds
bind -r h resize-pane -L 1
bind -r j resize-pane -D 1
bind -r k resize-pane -U 1
bind -r l resize-pane -R 1

# zoom active pain
bind -n C-z resize-pane -Z

# pane border
# set -g pane-border-style fg=colour245
# set -g pane-active-border-style "fg=colour245 bg=black"

# -------------------------------------------
# Clock
# -------------------------------------------
set -g clock-mode-style 24
set -g clock-mode-colour cyan

# -------------------------------------------
# Visual notifications
# -------------------------------------------
set -g window-status-activity-style "bold,fg=yellow"

# -------------------------------------------
# COPY MODE
# -------------------------------------------
# vi key binds
setw -g mode-keys vi

# start selection with 'v'
bind-key -T copy-mode-vi v send -X begin-selection

# 'y' to pbcopy
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# 'Enter' to pbcopy
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

